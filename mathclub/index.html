<script>
"use strict";

const skills = [
  {id:"fraction-sums", title:"Add and Subtract Fractions", description:"Find common denominators", icon:"±", color:"#ffc1cd", question:addFractions},
  {id:"fraction-products", title:"Multiply and Divide Fractions", description:"Work with parts of a whole", icon:"½", color:"#d8edb5", question:fractionProducts},
  {id:"decimals", title:"Decimal Operations", description:"Calculate with decimals", icon:".25", color:"#d5e7fd", question:decimals},
  {id:"powers", title:"Powers of Ten", description:"See how place value changes", icon:"10", color:"#b0ecfa", question:powers},
  {id:"volume", title:"Volume", description:"Measure in cubic units", icon:"▣", color:"#ffe395", question:volume},
  {id:"coordinates", title:"Coordinate Grids", description:"Read and move between points", icon:"⊹", color:"#ffd7bd", question:coordinates},
];

const mix = {id:"mix", title:"Mixed Practice", color:"#b0ecfa"};
const rounds = [...skills, mix];
let roundSize = 5;
const storageKey = "cku-math-club-grade-5-progress-v1";
const LEVELS = [
  {name:"Starter", icon:"🌱", size:5, F:0.5, steps:[0,0,1,1,2], desc:"Smaller numbers and warm up questions. Hints anytime."},
  {name:"Mid", icon:"⭐", size:5, F:1, steps:[0,1,2,3,4], desc:"The regular Math Club challenge. 5 questions."},
  {name:"Advanced", icon:"🚀", size:8, F:1.6, steps:[1,2,3,4], desc:"Bigger numbers, more word problems and trickier questions. 8 questions."},
  {name:"Grandmaster", icon:"👑", size:10, F:2.4, steps:[2,3,4], desc:"The toughest numbers and questions. 10 questions. Hints only show up after a miss."}
];
const levelKey = storageKey + "-level";
let tier = 1;
try { const saved = localStorage.getItem(levelKey); if (saved !== null && [0,1,2,3].includes(+saved)) tier = +saved; } catch {}
function progressKey(){ return tier === 1 ? storageKey : storageKey + "-L" + tier; }
function R(min, max){ return random(min, Math.max(min, Math.round(min + (max - min) * LEVELS[tier].F))); }
function RC(cap, min, max){ const hi = Math.min(cap, Math.max(min, Math.round(min + (max - min) * LEVELS[tier].F))); const lo = tier === 3 ? Math.max(min, Math.floor(hi / 2)) : min; return random(lo, hi); }
let stepOffset = 0;
function pickStep(i){ const s = LEVELS[tier].steps; return tier < 2 ? s[(i + stepOffset) % s.length] : s[random(0, s.length - 1)]; }
function renderLevels(){
  document.querySelector("#levelRow").innerHTML = LEVELS.map((l, i) => '<button type="button" class="lv" data-tier="' + i + '" aria-pressed="' + (i === tier) + '"><span aria-hidden="true">' + l.icon + '</span>' + l.name + '</button>').join("");
  document.querySelector("#levelDesc").textContent = LEVELS[tier].desc;
  document.querySelector("#roundInfo").textContent = "Every round has " + LEVELS[tier].size + " questions.";
}
function loadProgress(){
  progress = {};
  try {
    const saved = JSON.parse(localStorage.getItem(progressKey()) ?? "{}");
    for (const {id} of rounds) { const entry = saved?.[id];
      if (Number.isInteger(entry?.count) && entry.count > 0 && Number.isInteger(entry.best) && entry.best >= 0 && entry.best <= 10) progress[id] = entry; }
  } catch {}
}

const home = document.querySelector("#home");
const game = document.querySelector("#game");
const cards = document.querySelector("#cards");
const dialog = document.querySelector("#progress-dialog");
let activeRound;
let progress = {};
let storageAvailable = true;

try {
  const saved = JSON.parse(localStorage.getItem(progressKey()) ?? "{}");
  for (const {id} of rounds) {
    const entry = saved?.[id];
    if (Number.isInteger(entry?.count) && entry.count > 0 &&
        Number.isInteger(entry.best) && entry.best >= 0 && entry.best <= 10) {
      progress[id] = entry;
    }
  }
} catch {
  storageAvailable = false;
}

function random(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}

function shuffle(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index--) {
    const other = random(0, index);
    [copy[index], copy[other]] = [copy[other], copy[index]];
  }
  return copy;
}

function expression(value) {
  return '<div class="math-print">' + value + '</div>';
}

function numericChoices(answer, offsets, format = value => value) {
  const alternatives = shuffle(offsets.map(offset => answer + offset).filter(value => value >= 0)).slice(0, 2);
  return shuffle([answer, ...alternatives]).map(format);
}

function gcd(a, b) {
  while (b) [a, b] = [b, a % b];
  return a;
}

function fraction(numerator, denominator) {
  const factor = gcd(numerator, denominator);
  const top = numerator / factor;
  const bottom = denominator / factor;
  return bottom === 1 ? String(top) : top + "/" + bottom;
}

function addFractions(level) {
  const denominators = tier >= 2 ? [[3, 5], [6, 8], [5, 8], [6, 9], [8, 12]] : [[2, 3], [3, 4], [4, 6], [5, 6], [4, 8]];
  const [d1, d2] = denominators[level];
  const subtract = level === 2 || level === 3;
  let n1 = random(1, d1 - 1);
  let n2 = random(1, d2 - 1);
  if (subtract && n1 * d2 <= n2 * d1) {
    n1 = d1 - 1;
    n2 = 1;
  }
  const common = d1 * d2 / gcd(d1, d2);
  const total = n1 * common / d1 + (subtract ? -1 : 1) * n2 * common / d2;
  const answer = fraction(total, common);
  const equation = n1 + "/" + d1 + (subtract ? " − " : " + ") + n2 + "/" + d2 + " = ?";
  const story = "Chloe used " + n1 + "/" + d1 + " yard of ribbon. Carter used another " + n2 + "/" + d2 + " yard. How many yards did they use in all?";
  return {prompt:level === 4 ? story : subtract ? "Find the difference." : "Find the sum.",
    visual:level === 4 ? "" : expression(equation), answer,
    choices:numericChoices(total, [1, 2, -1, -2], value => fraction(value, common)),
    hint:"Rewrite both fractions using a common denominator. Then " + (subtract ? "subtract" : "add") + " the numerators and simplify."};
}

function fractionProducts(level) {
  if (level === 3) {
    const whole = random(2, 6);
    const parts = random(2, 8);
    const answer = whole * parts;
    return {prompt:"How many pieces of size 1/" + parts + " fit into " + whole + " wholes?",
      visual:expression(whole + " ÷ 1/" + parts + " = ?"), answer,
      choices:numericChoices(answer, [1, -1, 2, -2, parts, -parts].filter((offset, i, offsets) => offsets.indexOf(offset) === i)),
      hint:"Each whole splits into " + parts + " pieces. Count that many pieces for every whole."};
  }
  if (level === 4) {
    const whole = random(2, 5);
    const parts = random(2, 6);
    const denominator = parts * whole;
    return {prompt:"Carter splits 1/" + parts + " of a pan of cornbread equally among " + whole + " friends. What fraction of the whole pan does each friend get?",
      visual:"", answer:fraction(1, denominator),
      choices:shuffle([fraction(1, denominator), fraction(1, denominator + 1), fraction(1, denominator - 1)]),
      hint:"Divide the one piece into " + whole + " equal pieces. Each new piece is smaller than 1/" + parts + "."};
  }
  const d1 = RC(12, 2, 6);
  const n1 = random(1, d1 - 1);
  const d2 = level === 0 ? 1 : RC(12, 2, 7);
  const n2 = level === 0 ? R(2, 6) : random(1, d2 - 1);
  const total = n1 * n2;
  const denominator = d1 * d2;
  return {prompt:"Find the product.", visual:expression(n1 + "/" + d1 + " × " + (d2 === 1 ? n2 : n2 + "/" + d2) + " = ?"),
    answer:fraction(total, denominator),
    choices:numericChoices(total, [1, -1, 2, -2], value => fraction(value, denominator)),
    hint:"A whole number can be written over 1. Multiply the numerators and multiply the denominators, then simplify."};
}

function displayCents(cents) {
  return (cents / 100).toFixed(2);
}

function decimals(level) {
  const a = R(125, 995);
  const b = Math.min(R(15, 99), a - 1);
  if (level === 4) {
    const divisor = random(2, 8);
    const result = random(25, 175);
    const dividend = result * divisor;
    return {prompt:"Find the quotient.", visual:expression(displayCents(dividend) + " ÷ " + divisor + " = ?"),
      answer:displayCents(result), choices:numericChoices(result, [1, -1, 10, -10], displayCents),
      hint:"Think in hundredths. Divide the total number of hundredths, then write the result as a decimal."};
  }
  const multiply = level === 3;
  const subtract = level === 1 || level === 2;
  const result = multiply ? a * b : subtract ? a - b : a + b;
  const format = multiply ? value => (value / 10000).toFixed(4).replace(/0{1,2}$/, "") : displayCents;
  const story = "Chloe has $" + displayCents(a) + ". She spends $" + displayCents(b) + " on stickers. How much does she have left?";
  return {prompt:level === 2 ? story : multiply ? "Find the product." : subtract ? "Find the difference." : "Find the sum.",
    visual:level === 2 ? "" : expression(displayCents(a) + (multiply ? " × " : subtract ? " − " : " + ") + displayCents(b) + " = ?"),
    answer:level === 2 ? "$" + format(result) : format(result),
    choices:numericChoices(result, [1, -1, 10, -10], value => (level === 2 ? "$" : "") + format(value)),
    hint:multiply ? "Multiply as whole numbers first. The factors have four decimal places altogether, so count four places from the right in the product."
      : "Line up the decimal points so you combine the same place values."};
}

function powers(level) {
  const exponent = level === 0 ? RC(7, 2, 5) : RC(5, 1, 3);
  const power = 10 ** exponent;
  const notation = "10<sup>" + exponent + "</sup>";
  if (level === 0) {
    return {prompt:"What is this power of ten?", visual:expression(notation), answer:power,
      choices:shuffle([power, power * 10, power / 10]), hint:"The exponent tells how many factors of ten to multiply."};
  }
  const dividing = level === 2 || level === 4;
  const base = level < 3 ? random(12, 97) : random(125, 875) / 100;
  const result = dividing ? base / power : base * power;
  const format = value => String(Number(value.toPrecision(10)));
  return {prompt:dividing ? "Find the quotient." : "Find the product.",
    visual:expression(base + (dividing ? " ÷ " : " × ") + notation + " = ?"),
    answer:format(result), choices:shuffle([result, result * 10, result / 10]).map(format),
    hint:"Move each digit " + exponent + (exponent === 1 ? " place " : " places ") + (dividing ? "to the right." : "to the left.")};
}

function prism(length, width, height) {
  return '<div class="prism-model" role="img" aria-label="A rectangular prism ' + length + ' units long, ' +
    width + ' units wide, and ' + height + ' units high"><div class="prism-top"></div><div class="prism-side"></div>' +
    '<div class="prism-front"></div><span class="prism-length">' + length + '</span><span class="prism-width">' + width +
    '</span><span class="prism-height">' + height + '</span></div>';
}

function volume(level) {
  const length = RC(15, 3, 9);
  const width = RC(12, 2, 7);
  const height = RC(12, 2, 8);
  const layer = length * width;
  const total = layer * height;
  const missingHeight = level === 3;
  const combined = level === 4;
  const secondHeight = height + random(1, 4);
  const answer = missingHeight ? height : combined ? layer * (height + secondHeight) : total;
  const unit = missingHeight ? " units" : " cubic units";
  const format = value => value + unit;
  const story = "Two rectangular boxes sit side by side. Both are " + length + " units long and " + width +
    " units wide. One is " + height + " units high and the other is " + secondHeight + " units high. What is their total volume?";
  return {prompt:combined ? story : missingHeight ? "A box has a base area of " + layer + " square units and a volume of " +
    total + " cubic units. How tall is it?" : "What is the volume of this rectangular prism?",
    visual:combined || missingHeight ? "" : prism(length, width, height), answer:format(answer),
    choices:numericChoices(answer, missingHeight ? [1, -1, 2, -2] : [1, -1, layer, -layer], format),
    hint:combined ? "Find the volume of each box and add them." : missingHeight ? "Divide the volume by the area of its base."
      : "Multiply length by width to find one layer. Then multiply by the number of layers."};
}

function coordinateGrid(x, y) {
  const ticks = Array.from({length:7}, (_, value) =>
    '<span class="axis-tick tick-x" style="--position:' + (value * 100 / 6) + '%">' + value + '</span>' +
    (value ? '<span class="axis-tick tick-y" style="--position:' + (value * 100 / 6) + '%">' + value + '</span>' : "")).join("");
  return '<div class="coordinate-wrap" role="img" aria-label="From the origin, point A is ' + x + ' units to the right and ' +
    y + ' units up."><div class="coordinate-grid">' + ticks +
    '<span class="axis-label axis-x">x</span><span class="axis-label axis-y">y</span>' +
    '<span class="coordinate-point" style="--x:' + (x * 100 / 6) + '%;--y:' + (y * 100 / 6) + '%"><b>A</b></span></div></div>';
}

function coordinates(level) {
  const x = random(1, 5);
  const y = level === 1 ? 0 : random(x === 1 ? 2 : 1, 5);
  if (level >= 3) {
    const horizontal = level === 3;
    const distance = horizontal ? random(1, 6 - x) : random(1, 6 - y);
    const answer = "(" + (horizontal ? x + distance : x) + ", " + (horizontal ? y : y + distance) + ")";
    const wrongX = x + distance <= 6 ? x + distance : x - 1;
    const wrongY = y + distance <= 6 ? y + distance : y - 1;
    const wrong = "(" + (horizontal ? x : wrongX) + ", " + (horizontal ? wrongY : y) + ")";
    const same = "(" + x + ", " + y + ")";
    return {prompt:"Start at point A. Move " + distance + (distance === 1 ? " unit " : " units ") + (horizontal ? "right." : "up.") + " Where do you land?",
      visual:coordinateGrid(x, y), answer, choices:shuffle([answer, wrong, same]),
      hint:horizontal ? "Moving right increases the first number, the x coordinate." : "Moving up increases the second number, the y coordinate."};
  }
  const answer = "(" + x + ", " + y + ")";
  const wrong = x === y ? "(" + (x - 1) + ", " + y + ")" : "(" + y + ", " + x + ")";
  return {prompt:"What are the coordinates of point A?", visual:coordinateGrid(x, y), answer,
    choices:shuffle([answer, wrong, "(" + x + ", " + (y + 1) + ")"]),
    hint:"Read across to find x first, then read up to find y."};
}

function makeRound(option) {
  const mixedSkills = shuffle(skills);
  const startIndex = random(0, roundSize - 1);
  const questions = Array.from({length:roundSize}, (_, index) => {
    const skill = option.id === "mix" ? mixedSkills[index % mixedSkills.length] : option;
    const level = pickStep(index);
    return {...skill.question(level), skill};
  });
  return {option, questions, index:0, firstTry:0, attempted:new Set(), solved:false, finished:false};
}

function start(option) {
  roundSize = LEVELS[tier].size;
  stepOffset = option.id === "mix" ? random(0, 4) : 0;
  activeRound = makeRound(option);
  home.hidden = true;
  game.hidden = false;
  renderQuestion();
  window.scrollTo(0, 0);
}

function showHome() {
  activeRound = undefined;
  game.hidden = true;
  home.hidden = false;
  document.querySelector("#skills-title").focus({preventScroll:true});
  window.scrollTo(0, 0);
}

function renderQuestion() {
  const {index, questions} = activeRound;
  const question = questions[index];
  const bars = questions.map((_, step) => '<li class="' + (step < index ? "done" : step === index ? "current" : "") + '"></li>').join("");
  game.innerHTML = '<div class="game-nav"><button id="back" class="text-button" type="button">All games</button><span>Question ' +
    (index + 1) + ' of ' + roundSize + '</span></div><ol class="game-meter" aria-hidden="true">' + bars +
    '</ol><div class="game-panel"><span class="game-label" style="--color:' + question.skill.color + '">' + question.skill.title +
    '</span><h2 id="game-title" tabindex="-1">' + question.prompt + '</h2>' +
    (question.visual ? '<div class="visual">' + question.visual + '</div>' : '') + '<div class="answers" id="answers"></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p>' +
    '<div class="game-actions"><button type="button" id="hint" class="text-button">Show a hint</button>' +
    '<button id="next" class="primary dark" type="button" hidden>' + (index === roundSize - 1 ? "See my result" : "Next question") +
    '</button></div></div>';
  const answers = document.querySelector("#answers");
  for (const choice of question.choices) {
    const button = document.createElement("button");
    button.className = "answer";
    button.type = "button";
    button.textContent = choice;
    button.addEventListener("click", () => checkAnswer(button, choice, question));
    answers.append(button);
  }
  document.querySelector("#back").addEventListener("click", showHome);
  document.querySelector("#hint").addEventListener("click", () => {
    document.querySelector("#feedback").textContent = question.hint;
  });
  document.querySelector("#next").addEventListener("click", nextQuestion);
  if (tier === 3) document.querySelector("#hint").hidden = true;
  document.querySelector("#game-title").focus({preventScroll:true});
}

function checkAnswer(button, choice, question) {
  if (activeRound.solved || activeRound.attempted.has(choice)) return;
  const feedback = document.querySelector("#feedback");
  if (choice !== question.answer) {
    activeRound.attempted.add(choice);
    button.classList.add("wrong");
    button.setAttribute("aria-disabled", "true");
    feedback.textContent = "Try again. " + question.hint;
    return;
  }
  if (activeRound.attempted.size === 0) activeRound.firstTry++;
  activeRound.solved = true;
  button.classList.add("correct");
  feedback.textContent = "You got it!";
  for (const answer of document.querySelectorAll(".answer")) {
    answer.setAttribute("aria-disabled", "true");
  }
  document.querySelector("#hint").hidden = true;
  document.querySelector("#next").hidden = false;
}

function nextQuestion() {
  if (!activeRound.solved || activeRound.finished) return;
  if (activeRound.index === roundSize - 1) {
    finishRound();
    return;
  }
  activeRound.index++;
  activeRound.solved = false;
  activeRound.attempted = new Set();
  renderQuestion();
}

function finishRound() {
  activeRound.finished = true;
  const {option, firstTry} = activeRound;
  const entry = progress[option.id] ?? {count:0, best:0};
  progress[option.id] = {count:entry.count + 1, best:Math.max(entry.best, firstTry)};
  try {
    localStorage.setItem(progressKey(), JSON.stringify(progress));
    storageAvailable = true;
  } catch {
    storageAvailable = false;
  }
  game.innerHTML = '<div class="game-panel"><div class="result-symbol" aria-hidden="true">★</div><h2 id="game-title" tabindex="-1">' + LEVELS[tier].icon + ' ' + LEVELS[tier].name + ' round complete!</h2>' +
    '<p class="result-text">You solved all ' + roundSize + ' questions.<br>' + firstTry + ' of ' + roundSize + ' were right on your first try.</p>' +
    '<div class="game-actions"><button class="primary dark" type="button" id="again">Play again</button>' +
    '<button class="text-button" type="button" id="back">All games</button></div></div>';
  document.querySelector("#again").addEventListener("click", () => start(option));
  document.querySelector("#back").addEventListener("click", showHome);
  document.querySelector("#game-title").focus({preventScroll:true});
}

function showProgress() {
  const completed = Object.values(progress).reduce((total, entry) => total + entry.count, 0);
  document.querySelector("#progress-intro").textContent = LEVELS[tier].icon + " " + LEVELS[tier].name + " level: " + (completed === 1 ? "1 round finished" : completed + " rounds finished");
  document.querySelector("#storage-note").textContent = storageAvailable ? "Progress is saved in this browser." : "Progress is available while this page is open.";
  document.querySelector("#progress-list").innerHTML = rounds.map(({id, title}) => {
    const entry = progress[id];
    const summary = entry ? "Best first try score " + entry.best + " of " + LEVELS[tier].size : "Ready to play";
    return '<div class="progress-row"><strong>' + title + '</strong><span>' + summary + '</span></div>';
  }).join("");
  dialog.showModal();
}

renderLevels();
document.querySelector("#levelRow").addEventListener("click", event => {
  const b = event.target.closest("[data-tier]"); if (!b) return;
  tier = +b.dataset.tier; try { localStorage.setItem(levelKey, String(tier)); } catch {}
  loadProgress(); renderLevels();
});
for (const skill of skills) {
  const card = document.createElement("button");
  card.className = "card";
  card.type = "button";
  card.style.setProperty("--color", skill.color);
  card.innerHTML = '<span class="card-icon" aria-hidden="true">' + skill.icon + '</span><span><span class="card-title">' + skill.title +
    '</span><span class="card-desc">' + skill.description + '</span></span><span class="card-play" aria-hidden="true"><span class="play-icon"></span></span>';
  card.addEventListener("click", () => start(skill));
  cards.append(card);
}
document.querySelector("#mix").addEventListener("click", () => start(mix));
document.querySelector("#progress-open").addEventListener("click", showProgress);
document.querySelector("#progress-close").addEventListener("click", () => dialog.close());
document.querySelector(".brand").addEventListener("click", event => {
  event.preventDefault();
  showHome();
});

</script>

const frames = new Map();
const container = document.querySelector("#math-club");
const buttons = [...document.querySelectorAll("[data-grade]")];
const gradeKey = "cku-math-club-last-grade-v1";

function mountGrade(grade) {
  const frame = document.createElement("iframe");
  frame.title = "Grade " + grade + " Math Club";
  frame.addEventListener("load", () => {
    const page = frame.contentDocument;
    if (!page?.body || !page.querySelector("#home")) return;
    const sizeToContent = () => {
      if (!frame.hidden) frame.style.height = Math.ceil(page.body.getBoundingClientRect().height) + "px";
    };
    frame.sizeToContent = sizeToContent;
    const resize = new ResizeObserver(sizeToContent);
    resize.observe(page.body);
    const game = page.querySelector("#game");
    const viewChanges = new MutationObserver(() => {
      if (!frame.hidden) window.scrollTo(0, 0);
    });
    viewChanges.observe(game, { attributes: true, attributeFilter: ["hidden"] });
    sizeToContent();
  });
  const inner = document.getElementById("grade-" + grade).innerHTML.replace("CKU_EMBEDDED_LOGO", logo);
  frame.srcdoc = '<!doctype html><html lang="en"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Nunito:wght@700;800;900&display=swap"><title>' +
    frame.title + '</title></head><body>' + inner + '<' + '/body><' + '/html>';
  frames.set(grade, frame);
  container.append(frame);
  return frame;
}

function showGrade(grade) {
  for (const button of buttons) {
    button.setAttribute("aria-pressed", String(button.dataset.grade === grade));
  }
  for (const [number, frame] of frames) frame.hidden = number !== grade;
  const shown = frames.get(grade) || mountGrade(grade);
  shown.hidden = false;
  shown.sizeToContent?.();
  try { localStorage.setItem(gradeKey, grade); } catch {}
}

let initial = "1";
try {
  const saved = localStorage.getItem(gradeKey);
  if (buttons.some(button => button.dataset.grade === saved)) initial = saved;
} catch {}
for (const button of buttons) button.addEventListener("click", () => showGrade(button.dataset.grade));
showGrade(initial);
</script>
